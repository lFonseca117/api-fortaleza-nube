name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Escaneo de vulnerabilidades en dependencias (npm audit)
      - name: Vulnerabilidad en dependencias
        run: npm audit --audit-level=high

      # 2. Construcción local de la imagen Docker
      - name: Build de la imagen Docker
        run: docker build -t api-node-local:${{ github.sha }} .

      # 3. Escaneo de la imagen con Trivy
      - name: Escaneo con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-node-local:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue automático a AWS EC2 vía SSH 
      - name: Despliegue SSH en AWS EC2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app
            if [ ! -d .git ]; then git clone https://github.com/${{ github.repository }}.git .; else git pull; fi
            docker compose down
            docker compose up -d --build